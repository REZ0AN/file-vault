services:
  preview-converter:
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    networks:
      - preview
    ports:
      - "127.0.0.1:3001:3000"
    mem_limit: 1g
    cpus: 1.0
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --api-body-limit=6MB
      - --libreoffice-auto-start=true
      - --libreoffice-deny-private-ips=true
      - --libreoffice-deny-public-ips=true
      - --libreoffice-max-queue-size=4
      - --api-timeout=30s
  postgres:
    image: postgres:17
    container_name: file-vault-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: filevault
      POSTGRES_PASSWORD: filevault_dev_password
      POSTGRES_DB: filevault_db

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U filevault -d filevault_db
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
networks:
  preview:
